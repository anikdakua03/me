name: Deploy Admin to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'projects/me-admin/**'
      - 'projects/shared/**'
      - '.github/workflows/deploy-admin.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps # temporary until angular/fire is compatible with latest angular version

      - name: Generate environment.ts from secret
        run: |
          cat > projects/me-admin/src/environments/environment.ts << EOF
          export const environment = {
            production: true,
            firebase: ${{ secrets.ME_ADMIN_FIREBASE_CONFIG }}
          };
          EOF

      - name: Build shared library
        run: npx ng build shared --configuration production

      - name: Build admin app
        run: |
          npx ng build me-admin \
            --configuration production \
            --base-href /
        # Firebase Hosting serves at root, base-href is /

      - name: Create Firebase config from secrets
        run: |
          echo '{
            "projects": {
              "default": "${{ secrets.FIREBASE_PROJECT_ID }}"
            }
          }' > .firebaserc

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live