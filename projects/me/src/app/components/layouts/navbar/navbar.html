<header class="navbar-shell">
  <div class="navbar-inner">
    <!-- Left: Brand Logo -->
    <div class="nav-left">
      <a routerLink="/" class="brand">
        <mat-icon>chevron_left</mat-icon>
        <span class="brand-name">Anik Dakua</span>
        <mat-icon>chevron_right</mat-icon>
      </a>
    </div>

    <!-- Center: Links (Acts as a center row item on desktop, absolute card on mobile) -->
    <nav class="nav-links" [class.open]="menuOpen()">
      @for (link of links(); track link.path) {
        <a
          class="nav-item"
          [class.active]="activeSection() === link.path"
          (click)="handleMobileNavigation(link.id)"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- Right: Controls & Actions -->
    <div class="nav-right">
      <div class="theme-toggle" role="group" aria-label="Theme toggle">
        <mat-icon>light_mode</mat-icon>
        <button
          type="button"
          class="toggle-switch"
          (click)="toggleDark()"
          [attr.aria-pressed]="darkMode()"
        >
          <span class="knob" [class.on]="darkMode()"></span>
        </button>
        <mat-icon>dark_mode</mat-icon>
      </div>

      <!-- <a (click)="navigateToSection('contact')" class="nav-cta">Contact Me</a> -->

      <button
        type="button"
        class="mobile-toggle"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>
</header>
