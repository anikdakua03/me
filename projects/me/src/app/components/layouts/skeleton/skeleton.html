<div class="skeleton-loader w-full animate-pulse space-y-8">
  <!-- Title Section -->
  <div class="space-y-3">
    <div class="h-8 w-48 rounded-lg bg-slate-700"></div>
    <div class="h-5 w-3/4 rounded-lg bg-slate-700"></div>
  </div>

  <!-- Content Cards -->
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (item of [1, 2, 3, 4, 5, 6]; track item) {
      <mat-card class="overflow-hidden rounded-xl border border-slate-700 bg-slate-800 p-5">
        <div class="space-y-4">
          <!-- Card Title -->
          <div class="h-6 w-2/3 rounded bg-slate-700"></div>

          <!-- Card Description -->
          <div class="space-y-2">
            <div class="h-4 w-full rounded bg-slate-700"></div>
            <div class="h-4 w-5/6 rounded bg-slate-700"></div>
            <div class="h-4 w-4/6 rounded bg-slate-700"></div>
          </div>

          <!-- Footer -->
          <div class="flex justify-between pt-4">
            <div class="h-4 w-20 rounded bg-slate-700"></div>
            <div class="h-4 w-16 rounded bg-slate-700"></div>
          </div>
        </div>
      </mat-card>
    }
  </div>
</div>
